services:
  app:
    build:
      context: .
    image: lingolive:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MEDIA_ROOT: /var/lib/lingolive/media
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/lib/lingolive/media:/var/lib/lingolive/media
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
